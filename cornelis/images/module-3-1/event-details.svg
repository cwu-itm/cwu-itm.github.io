<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Clear status with supporting evidence</title><desc id="desc">Proposed selected event panel showing timestamp, activity, involved identities and systems and the reason for suspicion. Suspicious uses a contrasting badge and an explicit text label.</desc><style>text{font-family:Arial,sans-serif;fill:#f8f4ff;font-size:22px}.title{font-size:32px;font-weight:700}.small{font-size:19px}.box{fill:#34204f;stroke:#b5a1d4;stroke-width:2}.line{fill:none;stroke:#c4b4df;stroke-width:3}.gold{fill:#e9bc5a;stroke:#e9bc5a}.dark{fill:#221331}.muted{fill:#d3c5e8}</style><rect width="960" height="560" rx="20" fill="#1b102c"/><text x="40" y="58" class="title">Clear status with supporting evidence</text><rect class="box" x="40" y="100" width="880" height="410" rx="14"/><rect x="68" y="126" width="180" height="44" rx="8" fill="#e9bc5a"/><text x="88" y="156" class="dark">! Suspicious</text><text x="685" y="156" class="small muted">Selected event</text><text x="70" y="217" class="muted">Timestamp</text><text x="330" y="217">Event time + time zone</text><path class="line" d="M70 240H890"/><text x="70" y="282" class="muted">What happened</text><text x="330" y="282">Activity description</text><path class="line" d="M70 305H890"/><text x="70" y="347" class="muted">Who and where</text><text x="330" y="347">Related identities and systems</text><path class="line" d="M70 370H890"/><text x="70" y="412" class="muted">Why suspicious</text><text x="330" y="412">Detection reason + evidence</text><text x="70" y="474" class="small muted">The label directs attention. The evidence supports judgment.</text></svg>