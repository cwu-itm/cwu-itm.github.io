<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Keeping the investigation connected</title><desc id="desc">Separate alert, user and device pages require mental reconstruction. A linked diagram and timeline keep the sequence and relationships visible.</desc><style>text{font-family:Arial,sans-serif;fill:#f8f4ff;font-size:22px}.title{font-size:32px;font-weight:700}.small{font-size:19px}.box{fill:#34204f;stroke:#b5a1d4;stroke-width:2}.line{fill:none;stroke:#c4b4df;stroke-width:3}.gold{fill:#e9bc5a;stroke:#e9bc5a}.dark{fill:#221331}.muted{fill:#d3c5e8}</style><rect width="960" height="560" rx="20" fill="#1b102c"/><text x="40" y="58" class="title">Keeping the investigation connected</text><text x="40" y="108" class="muted">Moving between pages</text><rect class="box" x="40" y="140" width="240" height="90" rx="12"/><rect class="box" x="360" y="140" width="240" height="90" rx="12"/><rect class="box" x="680" y="140" width="240" height="90" rx="12"/><text x="110" y="194">Alert</text><text x="420" y="194">User page</text><text x="724" y="194">Device page</text><path class="line" d="M280 185H350 M600 185H670"/><text x="40" y="280" class="small">The analyst reconstructs order and connections across views.</text><text x="40" y="344" class="muted">Proposed linked view</text><rect class="box" x="40" y="375" width="880" height="135" rx="12"/><text x="88" y="427">Systems + identities</text><path class="line" d="M345 427H580 M345 420L333 427L345 434 M580 420L592 427L580 434"/><text x="630" y="427">Event timeline</text><text x="88" y="478" class="small">Select in either view. Keep the investigation in place.</text></svg>