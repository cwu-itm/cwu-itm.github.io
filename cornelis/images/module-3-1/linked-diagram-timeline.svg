<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">One selection. Two connected views.</title><desc id="desc">Proposed diagram of identities and systems alongside a chronological event timeline. Selecting the middle event highlights its related identity and device.</desc><style>text{font-family:Arial,sans-serif;fill:#f8f4ff;font-size:22px}.title{font-size:32px;font-weight:700}.small{font-size:19px}.box{fill:#34204f;stroke:#b5a1d4;stroke-width:2}.line{fill:none;stroke:#c4b4df;stroke-width:3}.gold{fill:#e9bc5a;stroke:#e9bc5a}.dark{fill:#221331}.muted{fill:#d3c5e8}</style><rect width="960" height="560" rx="20" fill="#1b102c"/><text x="40" y="58" class="title">One selection. Two connected views.</text><text x="40" y="107" class="muted">Systems and identities</text><text x="535" y="107" class="muted">Alert-related events · earliest first</text><rect class="box" x="45" y="150" width="175" height="75" rx="10"/><text x="76" y="196">Identity A</text><rect class="box" x="285" y="150" width="180" height="75" rx="10"/><text x="318" y="196">Identity B</text><rect class="box" x="45" y="350" width="175" height="75" rx="10"/><text x="80" y="396">Device A</text><rect class="box" x="285" y="350" width="180" height="75" rx="10"/><text x="320" y="396">Device B</text><path class="line" d="M132 225V350 M375 225V350 M220 187L375 350"/><rect x="39" y="144" width="187" height="87" rx="14" fill="none" stroke="#e9bc5a" stroke-width="4"/><rect x="279" y="344" width="192" height="87" rx="14" fill="none" stroke="#e9bc5a" stroke-width="4"/><path d="M220 187L375 350" fill="none" stroke="#e9bc5a" stroke-width="4"/><rect class="box" x="535" y="140" width="380" height="85" rx="10"/><text x="558" y="177">1 · Earlier related activity</text><text x="558" y="206" class="small muted">Identity A · Device A</text><rect x="535" y="250" width="380" height="110" rx="10" fill="#e9bc5a"/><text x="558" y="287" class="dark">2 · Selected event</text><text x="558" y="320" class="small dark">Identity A · Device B</text><text x="558" y="345" class="small dark">Suspicious</text><rect class="box" x="535" y="385" width="380" height="85" rx="10"/><text x="558" y="422">3 · Later related activity</text><text x="558" y="451" class="small muted">Identity B · Device B</text><text x="40" y="518" class="small muted">Proposed interaction: the selected event highlights its related entities.</text></svg>