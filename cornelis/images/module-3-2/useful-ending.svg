<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">End with an evidence-based handoff</title><desc id="desc">A useful ending preserves reviewed evidence, confirmed actions and unresolved questions.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#f6f0ff}.small{font-size:22px;fill:#d5c5ea}.head{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}</style></defs><rect width="960" height="600" rx="24" fill="#211334"/><text x="48" y="64" class="head">A useful ending preserves the work</text><g fill="#38204f" stroke="#b89be0" stroke-width="2"><rect x="64" y="115" width="832" height="100" rx="14"/><rect x="64" y="240" width="832" height="100" rx="14"/><rect x="64" y="365" width="832" height="100" rx="14"/></g><g fill="#e9bc5a"><circle cx="115" cy="165" r="16"/><circle cx="115" cy="290" r="16"/><circle cx="115" cy="415" r="16"/></g><g class="label"><text x="158" y="172">Evidence reviewed</text><text x="158" y="297">Actions actually confirmed</text><text x="158" y="422">Questions still unresolved</text></g><text x="64" y="545" class="small">Clear closure without hiding uncertainty.</text></svg>