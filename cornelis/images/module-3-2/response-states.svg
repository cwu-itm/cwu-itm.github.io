<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Feedback is a sequence</title><desc id="desc">Three distinct states: selection acknowledged, evidence loading and result confirmed. Acknowledgment does not mean completion.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#f6f0ff}.small{font-size:22px;fill:#d5c5ea}.head{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}</style></defs><rect width="960" height="600" rx="24" fill="#211334"/><text x="48" y="64" class="head">Acknowledge. Explain. Confirm.</text><path d="M170 190H790" stroke="#b89be0" stroke-width="5"/><g fill="#e9bc5a"><circle cx="170" cy="190" r="18"/><circle cx="480" cy="190" r="18"/><circle cx="790" cy="190" r="18"/></g><g class="label" text-anchor="middle"><text x="170" y="260">Input received</text><text x="480" y="260">Loading evidence</text><text x="790" y="260">Result confirmed</text></g><g class="small" text-anchor="middle"><text x="170" y="305">Show selection</text><text x="480" y="305">State what is pending</text><text x="790" y="305">Show actual outcome</text></g><rect x="64" y="385" width="832" height="125" rx="16" fill="#38204f" stroke="#e9bc5a" stroke-width="2"/><text x="100" y="435" class="label">Fast feedback must stay truthful.</text><text x="100" y="475" class="small">A received request is not a completed security action.</text></svg>