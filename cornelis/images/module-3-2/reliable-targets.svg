<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Make selection reliable</title><desc id="desc">A whole event card is the selection target. A separate consequential action requires deliberate review.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#f6f0ff}.small{font-size:22px;fill:#d5c5ea}.head{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}</style></defs><rect width="960" height="600" rx="24" fill="#211334"/><text x="48" y="64" class="head">Make the intended target easy to reach</text><rect x="64" y="125" width="832" height="200" rx="18" fill="#38204f" stroke="#e9bc5a" stroke-width="4"/><text x="100" y="175" class="small">SELECTED EVENT</text><text x="100" y="225" class="label">User → device → activity</text><text x="100" y="275" class="small">The full card selects this event.</text><path d="M115 365V405H440" fill="none" stroke="#b89be0" stroke-width="3"/><rect x="480" y="365" width="416" height="108" rx="14" fill="#211334" stroke="#d5c5ea" stroke-width="2"/><text x="510" y="410" class="label">Review device action</text><text x="510" y="447" class="small">Separate from navigation</text><text x="64" y="545" class="small">Large targets + clear spacing + deliberate confirmation</text></svg>